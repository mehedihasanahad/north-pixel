<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="55%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Outer diamond fill -->
  <polygon points="20,2 38,20 20,38 2,20" fill="url(#g)" opacity="0.18"/>
  <!-- Outer diamond stroke -->
  <polygon points="20,2 38,20 20,38 2,20" fill="none" stroke="url(#g)" stroke-width="1.5"/>
  <!-- Cross arms -->
  <line x1="20" y1="6"  x2="20" y2="34" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6"  y1="20" x2="34" y2="20" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center pixel -->
  <rect x="16" y="16" width="8" height="8" rx="1.5" fill="url(#g)"/>
  <!-- North accent dot (gold) -->
  <circle cx="20" cy="6"  r="1.8" fill="#F59E0B"/>
  <!-- Other cardinal dots -->
  <circle cx="20" cy="34" r="1.2" fill="#7C3AED"/>
  <circle cx="6"  cy="20" r="1.2" fill="#7C3AED"/>
  <circle cx="34" cy="20" r="1.2" fill="#A855F7"/>
</svg>
